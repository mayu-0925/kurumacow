name: 記事自動生成

on:
  schedule:
    # 毎週月曜 9:00 JST (= 0:00 UTC) に実行
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      topic_index:
        description: "トピックのインデックス番号 (0〜24)"
        required: false
        default: "0"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 依存関係インストール
        run: npm ci

      - name: 記事生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          INDEX=${{ github.event.inputs.topic_index || '0' }}
          npx tsx scripts/generate-article.ts $INDEX

      - name: 変更をコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/articles/
          git diff --staged --quiet || git commit -m "chore: 記事自動生成 $(date '+%Y-%m-%d')"
          git push
