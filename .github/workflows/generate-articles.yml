name: 記事自動生成 & デプロイ

on:
  schedule:
    # 毎日 9:00 JST (= 0:00 UTC) に実行
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      topic_index:
        description: "トピックのインデックス番号 (0〜24)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 依存関係インストール
        run: npm ci

      - name: 記事生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TODAY=$(date -u '+%Y-%m-%d')

          # 手動実行時は指定インデックス、自動実行時は既存記事数ベースでローテーション
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INDEX=${{ github.event.inputs.topic_index || '0' }}
          else
            # 今日すでに記事が生成済みならスキップ
            if grep -rl "\"publishedAt\": \"$TODAY\"" content/articles/ 2>/dev/null | grep -q .; then
              echo "⏭️ 今日（$TODAY）の記事はすでに生成済みです。スキップします。"
              exit 0
            fi
            ARTICLE_COUNT=$(ls content/articles/*.json 2>/dev/null | wc -l | tr -d ' ')
            INDEX=$(( ARTICLE_COUNT % 25 ))
          fi
          echo "使用トピックインデックス: $INDEX"
          npx tsx scripts/generate-article.ts $INDEX

      - name: 変更をコミット・プッシュ
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add content/articles/
          git diff --staged --quiet || git commit -m "chore: 記事自動生成 $(date '+%Y-%m-%d')"
          git push

      - name: ビルド
        run: npm run build

      - name: FTP デプロイ (Xserver)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./out/
