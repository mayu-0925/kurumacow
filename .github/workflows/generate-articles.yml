name: 記事自動生成 & デプロイ

on:
  schedule:
    # 毎日 9:00 JST (= 0:00 UTC) に実行
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      topic_index:
        description: "トピックのインデックス番号 (0〜24)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: 依存関係インストール
        run: npm ci

      - name: 記事生成（1記事目）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
        run: |
          TODAY=$(date -u '+%Y-%m-%d')

          # 自動実行時: 今日すでに2記事以上生成済みならスキップ
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            COUNT=$(grep -rl "\"publishedAt\": \"$TODAY\"" content/articles/ 2>/dev/null | wc -l | tr -d ' ')
            if [ "$COUNT" -ge 2 ]; then
              echo "⏭️ 今日（$TODAY）の記事はすでに${COUNT}件生成済みです。スキップします。"
              exit 0
            fi
          fi

          npx tsx scripts/generate-article.ts 0

      - name: 記事生成（2記事目）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
        run: |
          TODAY=$(date -u '+%Y-%m-%d')

          # 自動実行時: 今日すでに2記事以上生成済みならスキップ
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            COUNT=$(grep -rl "\"publishedAt\": \"$TODAY\"" content/articles/ 2>/dev/null | wc -l | tr -d ' ')
            if [ "$COUNT" -ge 2 ]; then
              echo "⏭️ 今日（$TODAY）の記事はすでに${COUNT}件生成済みです。スキップします。"
              exit 0
            fi
          fi

          npx tsx scripts/generate-article.ts 0

      - name: 変更をコミット・プッシュ
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add content/articles/ public/images/articles/
          git diff --staged --quiet || git commit -m "chore: 記事自動生成 $(date '+%Y-%m-%d')"
          git pull --rebase origin main
          git push

      # ビルド・デプロイは記事コミットのpushを検知したdeploy.ymlが担当
