name: デプロイ (FTP → Xserver)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: 依存関係インストール
        run: npm ci

      - name: ビルド
        run: npm run build

      - name: lftp インストール
        run: sudo apt-get install -y lftp

      - name: FTP デプロイ (Xserver)
        env:
          FTP_SERVER: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set net:timeout 120
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set ftp:passive-mode on
          set mirror:parallel-transfer-count 4
          mirror --reverse --delete --verbose --no-perms --exclude '.DS_Store' ./out/ $FTP_SERVER_DIR
          quit
          EOF
